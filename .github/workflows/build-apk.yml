name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android platform folder
        run: |
          flutter create . \
            --platforms=android \
            --org com.tradingtracker \
            --project-name trading_tracker

      - name: Configure Android SDK 36
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

          sed -i \
            's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' \
            android/app/build.gradle.kts

      - name: Set app display name
        run: |
          sed -i \
            's/android:label="trading_tracker"/android:label="Trading Tracker"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trading-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Trading Tracker build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
