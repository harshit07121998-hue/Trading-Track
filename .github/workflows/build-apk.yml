name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
 contents: Write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android platform folder
        # This project ships lib/ + pubspec.yaml only. This regenerates the
        # android/ folder using the exact Flutter/Gradle versions installed
        # above, avoiding any version-mismatch issues.
        run: flutter create . --platforms=android --org com.tradingtracker --project-name trading_tracker

      - name: Set app display name
        run: |
          sed -i 's/android:label="trading_tracker"/android:label="Trading Tracker"/' android/app/src/main/AndroidManifest.xml

      - name: Bump compileSdk / targetSdk
        # flutter_plugin_android_lifecycle (pulled in by file_picker) requires
        # compiling against API 36+. flutter create's default template may
        # set an older value depending on the Flutter version, so force it.
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts
          cat android/app/build.gradle.kts | grep -E "compileSdk|targetSdk"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trading-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Trading Tracker build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
